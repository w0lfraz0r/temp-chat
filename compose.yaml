name: temporary-chat

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tempchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-tempchat}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-56379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build:
      context: .
      target: development
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tempchat}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-tempchat}
      REDIS_URL: redis://redis:6379
      REDIS_PREFIX: ${REDIS_PREFIX:-temp-chat-dev}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      PORT: '3001'
      HOST: 0.0.0.0
    ports:
      - '127.0.0.1:5173:5173'
      - '127.0.0.1:3001:3001'
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['sh', '-c', 'npm ci && npm run dev']

volumes:
  postgres-data:
  node-modules:
