name: temporary-chat-distributed

x-api: &api
  build:
    context: .
    target: api
  init: true
  stop_grace_period: 15s
  environment:
    DATABASE_URL: postgresql://tempchat:local-development-only@postgres:5432/tempchat
    REDIS_URL: redis://redis:6379
    REDIS_PREFIX: temp-chat-distributed
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    PORT: '3001'
    TRUSTED_PROXIES: 172.30.42.10/32
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [backend]
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tempchat
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: tempchat
    volumes: [distributed-postgres:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'tempchat', '-d', 'tempchat']
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    networks: [backend]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30

  api-a:
    <<: *api

  api-b:
    <<: *api

  proxy:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:3001:3001']
    volumes: ['./deploy/nginx.conf:/etc/nginx/nginx.conf:ro']
    networks:
      backend:
        ipv4_address: 172.30.42.10
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.42.0/24

volumes:
  distributed-postgres:
